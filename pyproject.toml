[project]
name = "wjx-desktop"
version = "2.1.0"
description = "桌面端问卷作业工具：协议级答卷生成与提交"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pywebview>=5.0",
]

[project.optional-dependencies]
build = ["nuitka>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
wjxdesk = "wjxdesk.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wjxdesk*"]

[tool.setuptools.package-data]
"wjxdesk.protocol.wjx" = ["manifest.json"]
"wjxdesk" = ["assets/*.ico"]
